version: '3.3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seisoapp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-seisoapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seisoapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bawui-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seisoapp-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seisoapp}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8085}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bawui-net

  seisoapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seisoapp
    restart: always
    ports:
      - "8085:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bawui-net

volumes:
  pgdata:

networks:
  bawui-net:
    driver: bridge
