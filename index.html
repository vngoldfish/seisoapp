<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hotel room cleaning management system - Track housekeeping, room status, and staff assignments. 客室清掃管理システム" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <title>客室清掃管理 | Room Cleaning Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister service worker on localhost to avoid caching issues in development
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          }).catch((err) => {
            console.warn('Failed to unregister local service workers:', err);
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
              .then(reg => console.log('Service Worker registered successfully!', reg))
              .catch(err => console.log('Service Worker registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
